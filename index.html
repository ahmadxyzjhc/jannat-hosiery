<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jannat Hosiery & Cosmetics</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

<div class="navbar">

<div class="logo">
Jannat Hosiery & Cosmetics
</div>

<div class="search-box">
<input
type="text"
id="search"
placeholder="Search products...">
</div>

<nav>
<a href="#">Home</a>
<a href="#products-section">Products</a>
<a href="#contact">Contact</a>
</nav>

</div>

<div class="hero">

<h1>Welcome to Jannat Hosiery & Cosmetics</h1>

<p>Beauty • Hosiery • Cosmetics • Personal Care</p>

<button onclick="document.getElementById('products-section').scrollIntoView({behavior:'smooth'})">
Browse Products
</button>

</div>

</header>

<section class="container" id="products-section">

<h2 class="section-title">
Featured Products
</h2>

<div class="categories">

<button onclick="filterCategory('All')">All</button>

<button onclick="filterCategory('Skin Care')">
Skin Care
</button>

<button onclick="filterCategory('Makeup')">
Makeup
</button>

<button onclick="filterCategory('Fragrance')">
Fragrance
</button>

<button onclick="filterCategory('Hair Care')">
Hair Care
</button>

<button onclick="filterCategory('Hosiery')">
Hosiery
</button>

</div>

<div id="products" class="product-grid"></div>

</section>

<footer id="contact">

<h2>Contact Us</h2>

<p>📍 Jannat Hosiery & Cosmetics</p>

<p>📞 WhatsApp: +91 XXXXXXXXXX</p>

<p>© 2026 Jannat Hosiery & Cosmetics</p>

</footer>

<script src="products.js"></script>
<script src="script.js"></script>

</body>

</html>
